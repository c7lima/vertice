# O dashboard como CÓDIGO: "Projeto Farol · Portfólio".
#
# O JSON é gerado por scripts/gerar_dashboard.py: tem diff, revisão e rollback.
# dataset_catalog e dataset_schema deixam as queries com nome de tabela puro
# (`FROM projeto_situacao_atual`): o mesmo dashboard aponta para dev ou prod.
#
# A chave dashboard_portfolio NÃO pode ser renomeada: o bundle identifica o
# dashboard por ela. Trocar a chave apaga o dashboard e cria outro, com URL nova.

resources:
  dashboards:
    dashboard_portfolio:
      display_name: Projeto Farol · Portfólio
      file_path: ../resources/dashboard-portfolio.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
