# O job do Projeto Farol: a Torre inteira, toda segunda às 6h (pausado em dev).
# Nasceu do job "Ingestão" da noite 2 (bundle generate) e ganhou uma tarefa por prompt.
#
#   ingestao_feriados    a API de feriados (BrasilAPI) → bronze.feriados
#   ingestao_data_lake   o data lake (Supabase Storage via boto3) → volume raw → as 9 tabelas da bronze
#   conferencia_bronze   as 9 contagens da bronze, ou raise_error (nada roda com meio dado)
#   medalhao             o pipeline vertice_medalhao: silver (as 3 ferramentas viram uma) e gold (os KPIs)
#   testes_de_qualidade  os 10 testes da silver e da gold, ou raise_error
#   status_com_ia        a causa de cada atraso tirada do texto do status (regra + IA + palavra-chave, MERGE)
#   ml_features          noite 4: as features do modelo (projeto × semana, só olhando para trás)
#   ml_modelo            noite 4: baselines, treino, testes e o registro @prod no Unity Catalog
#   ml_score             noite 4: a lista de segunda-feira (gold.score_estouro_30d, com os motivos)
#
# O DAG: as duas ingestões em paralelo → conferência → medalhão → testes e IA em paralelo
#        → ml_features → ml_modelo → ml_score.

resources:
  jobs:
    vertice_farol:
      name: vertice_farol

      # Toda segunda às 6h, depois do status de sexta. Em dev o preset do databricks.yml pausa.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo

      # Uma execução por vez: duas ao mesmo tempo apagariam a bronze uma da outra.
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true

      # Um ambiente serverless só para os dois notebooks de ingestão (o boto3 já vem na
      # versão 6). Sem ele, cada notebook sobe a própria computação, e o Free Edition
      # recusou o pipeline logo depois (RESOURCE_EXHAUSTED).
      environments:
        - environment_key: padrao
          spec:
            environment_version: "6"

      tasks:
        # ── 0. a ingestão da noite 2, as duas em paralelo ─────────────
        - task_key: ingestao_feriados
          environment_key: padrao
          notebook_task:
            notebook_path: ../src/ingestao/01_ingestao_api.py
            source: WORKSPACE

        # As chaves NÃO ficam neste arquivo: são variáveis do bundle (${var.…}).
        - task_key: ingestao_data_lake
          environment_key: padrao
          notebook_task:
            notebook_path: ../src/ingestao/02_ingestao_boto3.py
            source: WORKSPACE
            base_parameters:
              S3_ENDPOINT: https://rxaicthszqjspuvsirby.storage.supabase.co/storage/v1/s3
              AWS_DEFAULT_REGION: us-east-1
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}

        # ── 1. a bronze chegou inteira? ───────────────────────────────
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # ── 2. o medalhão: silver e gold no mesmo pipeline ────────────
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

        # ── 3. os 10 testes: melhor o job falhar do que o diretor ver número errado ──
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql

        # ── 4. a IA no texto do status (em paralelo com os testes) ────
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ia/status_estruturado.sql

        # ── noite 4 · o modelo: o que vai dar errado no próximo mês ───
        - task_key: ml_features
          depends_on:
            - task_key: testes_de_qualidade
            - task_key: status_com_ia
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/01-features.sql

        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/02-modelo.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_score
          depends_on:
            - task_key: ml_modelo
          notebook_task:
            notebook_path: ../src/ml/03-score.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
