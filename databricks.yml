# Projeto Farol · a Torre de Controle da Vértice Tecnologia.
#
# Este bundle nasceu à mão na noite 3 (bundle init + bundle generate do job "Ingestão"
# da noite 2) e ganha uma camada por prompt. Tudo roda em serverless.

bundle:
  name: vertice
  uuid: fc81105c-a07b-4dbf-a2ae-e9d35a578054

include:
  - resources/*.yml

# Catálogo e warehouse em variável: o mesmo código roda em dev e em prod sem editar uma linha.
variables:
  catalog:
    description: Catálogo do Unity Catalog onde as três camadas moram (criado na noite 1)
    default: lakehouse_vertice
  warehouse_id:
    description: SQL Warehouse serverless que executa as tarefas SQL
    default: 5e59f9f92f866a12

  # As chaves do data lake NÃO têm default: o valor fica em
  # .databricks/bundle/dev/variable-overrides.json, que o .gitignore deixa fora do Git.
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    default: true
    # Sem `mode: development`: ele prefixaria os nomes com [dev usuario] e quebraria
    # o SQL da noite. Em troca, o agendamento fica pausado em dev.
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-9bc4ba2b-5798.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-9bc4ba2b-5798.cloud.databricks.com
      root_path: /Workspace/Users/c7lima@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: c7lima@gmail.com
        level: CAN_MANAGE
